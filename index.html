<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Roman Space Observer - Mobile Touch Edition</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Touch-control sizing. NOTE: the game's internal render resolution is now
       fixed at 1280x720 inside app.bundle.js (see the Re({width:1280,height:720,...})
       call), instead of being derived from whatever the canvas's on-screen box
       happened to measure at load. That was the actual mobile bug: every HUD
       element in the game (score, stats, the ship, the intro screen) is positioned
       with hardcoded pixel math against that internal resolution, so when the
       canvas's box was small/irregular on a phone, HUD elements collided with
       each other and with gameplay objects - no amount of CSS around the canvas
       could fix internal layout math done in pixels the CSS never sees.
       Now that the internal resolution is fixed and consistent everywhere, the
       canvas can simply fill the screen (object-fit: contain below preserves the
       16:9 aspect ratio and letterboxes automatically) and the controls just need
       to float in the corners - no more fragile margin math shrinking the canvas
       to "make room". */
    :root {
      --ctrl-cell: clamp(34px, 8vw, 48px);
      --ctrl-gap: 4px;
      --ctrl-pad: clamp(6px, 2vw, 16px);
      --action-size: clamp(52px, 12vw, 72px);
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #050b14; /* Deep space blue to blend with letterboxing */
      touch-action: none;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }

    /* The canvas always fills the full viewport now. Its internal drawing
       resolution is locked to 1280x720 (see app.bundle.js), so object-fit:contain
       just letterboxes/pillarboxes it to fit any screen shape without ever
       stretching or distorting the game, and without needing to reserve margin
       space for the touch controls - they float on top instead (see below). */
    #container {
      display: block;
      width: 100vw;
      height: 100dvh;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      object-fit: contain;
    }

    /* --- Responsive NASA UI Elements --- */
    #rstLangDiv {
      width: 100% !important;
      height: 100dvh !important;
      position: fixed !important;
      inset: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      padding: 20px;
    }

    .lang-en {
      font-size: clamp(13px, 3.5vw, 18px) !important;
      color: #fff !important;
      font-family: 'Press Start 2p', monospace, sans-serif !important;
      text-align: center !important;
      line-height: 1.8 !important;
      padding: 12px 20px;
      border: 2px dashed #00d2ff;
      border-radius: 12px;
      background: rgba(0, 210, 255, 0.1);
      cursor: pointer;
    }

    #rstDiv {
      background-color: rgba(0, 0, 0, 0.95) !important;
      position: fixed !important;
      inset: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-direction: column !important;
      color: #fff !important;
      padding: 15px 24px !important;
      z-index: 1000 !important;
      overflow-y: auto !important;
    }

    #rstHeading {
      font-size: clamp(16px, 4vw, 24px) !important;
      font-family: 'Press Start 2p', monospace, sans-serif !important;
      margin-bottom: 8px !important;
      text-align: center !important;
      color: #00d2ff !important;
    }

    #rstDiv h5 {
      font-size: clamp(10px, 2.5vw, 13px) !important;
      font-family: 'Press Start 2p', monospace, sans-serif !important;
      line-height: 1.5 !important;
      text-align: center !important;
      max-width: 680px !important;
      margin: 8px 0 14px 0 !important;
      opacity: 0.9;
    }

    #rstButton {
      font-size: clamp(14px, 3.2vw, 18px) !important;
      font-family: 'Press Start 2p', monospace, sans-serif !important;
      padding: 12px 28px !important;
      background-color: #00276b !important;
      color: #fff !important;
      border: 2px solid #00d2ff !important;
      border-radius: 14px !important;
      cursor: pointer !important;
      box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3) !important;
      text-shadow: none !important;
    }
    #rstButton:active {
      transform: scale(0.95);
      background-color: #00d2ff !important;
      color: #000 !important;
    }

    /* --- Top Language Selector Quick Bar --- */
    .top-lang-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 9999999;
      pointer-events: auto;
    }
    .lang-pill-btn {
      background: rgba(0, 20, 60, 0.85);
      border: 2px solid #00d2ff;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 2.8vw, 14px);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .lang-pill-btn:active {
      background: #00d2ff;
      color: #000;
      transform: scale(0.94);
    }

    /* --- Mobile Virtual Controls Overlay --- */
    /* Hidden by default; only shown on touch-capable devices (see .is-touch-device below).
       This is the "cross platform" switch: desktop/mouse+keyboard users never see
       the on-screen D-pad/SNAP button, touch/mobile users always do. */
    .touch-ctrl-container {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999999;
      justify-content: space-between;
      align-items: flex-end;
      padding: var(--ctrl-pad);
      padding-bottom: max(env(safe-area-inset-bottom, 8px), 8px);
    }
    html.is-touch-device .touch-ctrl-container {
      display: flex;
    }

    /* --- Desktop keyboard hint (mirrors the mobile touch controls) --- */
    .desktop-key-hint {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #cfefff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .desktop-key-hint.fade-out {
      opacity: 0;
    }
    html.is-desktop-device .desktop-key-hint {
      display: block;
    }

    .touch-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.85);
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      transition: transform 0.05s ease, background 0.05s ease;
      cursor: pointer;
      outline: none;
    }
    .touch-btn:active {
      background: rgba(0, 200, 255, 0.7);
      transform: scale(0.92);
    }

    /* Dynamic Movable Virtual Joystick on Left Side */
    .joystick-zone {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 55vw;
      height: 75vh;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 999999;
    }
    .joystick-base {
      position: fixed;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 200, 255, 0.22) 0%, rgba(0, 0, 0, 0.55) 80%);
      border: 2px solid rgba(0, 200, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 0 12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      opacity: 0.8;
      bottom: 16px;
      left: 75px;
    }
    .joystick-base.active {
      opacity: 1;
      border-color: rgba(0, 230, 255, 0.9);
      box-shadow: 0 0 25px rgba(0, 220, 255, 0.6), inset 0 0 15px rgba(0, 200, 255, 0.5);
    }
    .joystick-knob {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(0, 190, 255, 0.95) 100%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 200, 255, 0.7);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Action Snap & Retry Buttons explicitly locked to Bottom Right */
    .action-group {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom, 16px), 16px);
      right: max(env(safe-area-inset-right, 16px), 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 9999999;
      pointer-events: auto;
    }
    .btn-retry {
      width: clamp(44px, 9.5vw, 56px);
      height: clamp(44px, 9.5vw, 56px);
      font-size: clamp(10px, 2.2vw, 12px);
      text-align: center;
      background: rgba(0, 200, 100, 0.4);
      border-color: rgba(100, 255, 180, 0.7);
      line-height: 1.1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
    .btn-retry:active {
      background: rgba(0, 220, 100, 0.9);
      transform: scale(0.92);
    }
    .btn-action {
      width: var(--action-size);
      height: var(--action-size);
      font-size: clamp(11px, 2.8vw, 14px);
      text-align: center;
      background: rgba(255, 50, 50, 0.35);
      border-color: rgba(255, 120, 120, 0.6);
      line-height: 1.15;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
    .btn-action:active {
      background: rgba(255, 50, 50, 0.9);
      transform: scale(0.92);
    }

    /* Portrait Rotation Hint */
    .portrait-hint {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 20, 50, 0.92);
      border: 1.5px solid #00d2ff;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 3vw, 14px);
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 99999999;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
    }

    /* Only nudge people to rotate when they're actually on a touch device -
       a desktop window in a "portrait-ish" shape shouldn't show this. */
    @media (orientation: portrait) {
      html.is-touch-device .portrait-hint {
        display: block;
      }
    }
  </style>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
  <script defer src="app.bundle.js?v=13"></script>
</head>
<body>
  <canvas id="container"></canvas>

  <!-- Portrait Orientation Hint (touch devices only) -->
  <div class="portrait-hint">🔄 Rotate phone to Landscape for best view</div>

  <!-- Keyboard Controls Hint (desktop/mouse devices only) -->
  <div class="desktop-key-hint" id="desktop-key-hint">Move: ← ↑ → ↓ &nbsp;&nbsp;|&nbsp;&nbsp; Capture: SPACE &nbsp;&nbsp;|&nbsp;&nbsp; Retry: R</div>

  <!-- Quick Language Selector Buttons -->
  <div class="top-lang-bar" id="lang-bar">
    <button type="button" class="lang-pill-btn" id="btn-lang-1">🇬🇧 English (1)</button>
    <button type="button" class="lang-pill-btn" id="btn-lang-2">🇪🇸 Español (2)</button>
  </div>

  <!-- Floating Virtual Touch Controller -->
  <div class="touch-ctrl-container">
    <!-- Movable Virtual Joystick Zone -->
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
    </div>

    <!-- Snap & Retry Buttons -->
    <div class="action-group">
      <button type="button" class="touch-btn btn-retry" id="btn-retry" aria-label="Retry">
        🔄<br><span style="font-size:0.7em;">RETRY</span>
      </button>
      <button type="button" class="touch-btn btn-action" id="btn-space">
        SNAP<br><span style="font-size:0.7em; opacity:0.85;">SPACE</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      // --- Cross-platform device detection ---
      // A device is treated as "touch" if it has a coarse pointer (finger, not mouse)
      // OR exposes touch APIs. This is what decides whether the on-screen D-pad/SNAP
      // button (mobile) or the keyboard hint (desktop) is shown.
      function requestFullScreen() {
        // Disabled to prevent Chrome/Android from displaying invasive system notification toasts on tap
      }

      function isLikelyTouchDevice() {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
        return !!(coarse || hasTouch);
      }

      function applyDeviceClass() {
        var touch = isLikelyTouchDevice();
        document.documentElement.classList.toggle('is-touch-device', touch);
        document.documentElement.classList.toggle('is-desktop-device', !touch);
      }
      applyDeviceClass();

      // If someone plugs in a mouse on a touch device (or vice versa), keep it current
      // without being noisy: re-check on the first real interaction of each kind.
      window.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch' || e.pointerType === 'mouse') applyDeviceClass();
      }, { passive: true });

      // Fade the desktop keyboard hint out after the person starts playing.
      var keyHintFaded = false;
      function fadeKeyHint() {
        if (keyHintFaded) return;
        keyHintFaded = true;
        var hint = document.getElementById('desktop-key-hint');
        if (hint) hint.classList.add('fade-out');
      }
      setTimeout(fadeKeyHint, 6000);

      function sendKeyEvent(type, code, key, keyCode) {
        const ev = new KeyboardEvent(type, {
          bubbles: true,
          cancelable: true,
          view: window,
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode
        });

        // 1. Dispatch directly on the canvas (where Kaboom game engine listens)
        const canvas = document.getElementById('container');
        if (canvas) {
          canvas.dispatchEvent(ev);
        }
        // 2. Dispatch on document (where NASA intro handler listens)
        document.dispatchEvent(ev);
        // 3. Dispatch on window
        window.dispatchEvent(ev);
      }

      function bindKey(elementId, code, key, keyCode, autoHideBar) {
        const el = document.getElementById(elementId);
        if (!el) return;

        const press = (e) => {
          if (e.cancelable) e.preventDefault();
          requestFullScreen();
          sendKeyEvent('keydown', code, key, keyCode);
          if (autoHideBar) {
            const bar = document.getElementById('lang-bar');
            if (bar) bar.style.display = 'none';
          }
        };
        const release = (e) => {
          if (e.cancelable) e.preventDefault();
          sendKeyEvent('keyup', code, key, keyCode);
        };

        el.addEventListener('touchstart', press, { passive: false });
        el.addEventListener('touchend', release, { passive: false });
        el.addEventListener('touchcancel', release, { passive: false });
        el.addEventListener('mousedown', press);
        el.addEventListener('mouseup', release);
      }

      document.addEventListener('keydown', function (e) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
          fadeKeyHint();
        }
      });

      // Snap & Retry Buttons
      bindKey('btn-space', 'Space', ' ', 32, false);
      bindKey('btn-retry', 'KeyR', 'r', 82, false);

      // --- Dynamic Movable Virtual Joystick Implementation ---
      const joystickZone = document.getElementById('joystick-zone');
      const joystickBase = document.getElementById('joystick-base');
      const joystickKnob = document.getElementById('joystick-knob');

      let joystickActive = false;
      let joystickTouchId = null;
      let joystickCenter = { x: 75, y: window.innerHeight - 75 };
      const maxRadius = 45;

      const activeDirectionKeys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
      };

      function updateDirectionKey(code, key, keyCode, shouldBePressed) {
        if (activeDirectionKeys[code] !== shouldBePressed) {
          activeDirectionKeys[code] = shouldBePressed;
          sendKeyEvent(shouldBePressed ? 'keydown' : 'keyup', code, key, keyCode);
          if (shouldBePressed) fadeKeyHint();
        }
      }

      function onJoystickTouchStart(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (!joystickActive && touch.clientX < window.innerWidth * 0.55) {
            joystickActive = true;
            joystickTouchId = touch.identifier;
            requestFullScreen();

            // Reposition joystick base directly under user's thumb
            joystickCenter = { x: touch.clientX, y: touch.clientY };
            if (joystickBase) {
              joystickBase.style.left = touch.clientX + 'px';
              joystickBase.style.top = touch.clientY + 'px';
              joystickBase.style.bottom = 'auto';
              joystickBase.classList.add('active');
            }

            updateJoystickPos(touch.clientX, touch.clientY);
            if (e.cancelable) e.preventDefault();
            break;
          }
        }
      }

      function onJoystickTouchMove(e) {
        if (!joystickActive) return;
        for (let i = 0; i < e.touches.length; i++) {
          const touch = e.touches[i];
          if (touch.identifier === joystickTouchId) {
            updateJoystickPos(touch.clientX, touch.clientY);
            if (e.cancelable) e.preventDefault();
            break;
          }
        }
      }

      function updateJoystickPos(clientX, clientY) {
        const dx = clientX - joystickCenter.x;
        const dy = clientY - joystickCenter.y;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);

        const clampedDist = Math.min(dist, maxRadius);
        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;

        if (joystickKnob) {
          joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        }

        const deadzone = 10;
        const isUp = dy < -deadzone && Math.abs(dy) > Math.abs(dx) * 0.35;
        const isDown = dy > deadzone && Math.abs(dy) > Math.abs(dx) * 0.35;
        const isLeft = dx < -deadzone && Math.abs(dx) > Math.abs(dy) * 0.35;
        const isRight = dx > deadzone && Math.abs(dx) > Math.abs(dy) * 0.35;

        updateDirectionKey('ArrowUp', 'ArrowUp', 38, isUp);
        updateDirectionKey('ArrowDown', 'ArrowDown', 40, isDown);
        updateDirectionKey('ArrowLeft', 'ArrowLeft', 37, isLeft);
        updateDirectionKey('ArrowRight', 'ArrowRight', 39, isRight);
      }

      function onJoystickTouchEnd(e) {
        if (!joystickActive) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joystickTouchId) {
            joystickActive = false;
            joystickTouchId = null;

            if (joystickBase) {
              joystickBase.classList.remove('active');
            }
            if (joystickKnob) {
              joystickKnob.style.transform = 'translate(-50%, -50%)';
            }

            // Release all direction keys immediately
            updateDirectionKey('ArrowUp', 'ArrowUp', 38, false);
            updateDirectionKey('ArrowDown', 'ArrowDown', 40, false);
            updateDirectionKey('ArrowLeft', 'ArrowLeft', 37, false);
            updateDirectionKey('ArrowRight', 'ArrowRight', 39, false);
            break;
          }
        }
      }

      if (joystickZone) {
        joystickZone.addEventListener('touchstart', onJoystickTouchStart, { passive: false });
        window.addEventListener('touchmove', onJoystickTouchMove, { passive: false });
        window.addEventListener('touchend', onJoystickTouchEnd, { passive: false });
        window.addEventListener('touchcancel', onJoystickTouchEnd, { passive: false });
      }

      // Language selection keys
      bindKey('btn-lang-1', 'Digit1', '1', 49, true);
      bindKey('btn-lang-2', 'Digit2', '2', 50, true);

      // --- Fix: the game's own "Load Game" instructions panel (#rstDiv) is meant to
      // fade out the moment gameplay begins, but it gets left behind on top of the
      // canvas, making the game look like it never started even though it's running
      // underneath. We watch for Space being processed (from keyboard OR the on-screen
      // SNAP button) once the language has been chosen, and make sure that panel
      // actually goes away.
      function dismissIntroPanelIfStuck() {
        var langDiv = document.getElementById('rstLangDiv');
        if (langDiv) return; // still on the language screen, nothing to dismiss yet
        var introDiv = document.getElementById('rstDiv');
        if (!introDiv) return;
        introDiv.style.transition = 'opacity 0.4s ease';
        introDiv.style.opacity = '0';
        introDiv.style.pointerEvents = 'none';
        setTimeout(function () {
          if (introDiv && introDiv.parentNode) introDiv.parentNode.removeChild(introDiv);
        }, 400);
      }
      document.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.key === ' ') {
          setTimeout(dismissIntroPanelIfStuck, 50);
        }
      });

      // Tap language screen or instruction screen anywhere to progress & start game
      function handleOverlayTap(e) {
        requestFullScreen();
        const langDiv = document.getElementById('rstLangDiv');
        if (langDiv && (e.target === langDiv || langDiv.contains(e.target))) {
          sendKeyEvent('keydown', 'Digit1', '1', 49);
          sendKeyEvent('keyup', 'Digit1', '1', 49);
          const bar = document.getElementById('lang-bar');
          if (bar) bar.style.display = 'none';
        }

        const introDiv = document.getElementById('rstDiv');
        const btn = document.getElementById('rstButton');
        if (introDiv && (e.target === introDiv || introDiv.contains(e.target) || (btn && btn.contains(e.target)))) {
          sendKeyEvent('keydown', 'Space', ' ', 32);
          setTimeout(() => sendKeyEvent('keyup', 'Space', ' ', 32), 50);
          dismissIntroPanelIfStuck();
        }
      }

      document.addEventListener('click', handleOverlayTap);
      document.addEventListener('touchstart', function(e) {
        const langDiv = document.getElementById('rstLangDiv');
        const introDiv = document.getElementById('rstDiv');
        if ((langDiv && (e.target === langDiv || langDiv.contains(e.target))) ||
            (introDiv && (e.target === introDiv || introDiv.contains(e.target)))) {
          handleOverlayTap(e);
        }
      }, { passive: true });

      // Ask fullscreen to re-layout smoothly on rotation/resize. The canvas itself
      // is sized purely by the #container CSS rule above (100vw/100dvh + object-fit:
      // contain) - it does not need JS to push pixel dimensions into it, and doing so
      // used to fight the CSS and reintroduce sizing bugs on resize/rotate.
      window.addEventListener('orientationchange', function () {
        setTimeout(requestFullScreen, 50);
      });
    })();
  </script>
</body>
</html>
